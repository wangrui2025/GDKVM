name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Publish only when the built Pages artifact can change.
    paths:
      - 'website/src/**'
      - 'website/public/**'
      - 'website/assets/**'
      - 'website/scripts/**'
      - 'website/astro.config.mjs'
      - 'website/package.json'
      - 'website/pnpm-lock.yaml'
      - 'website/tsconfig.json'
      - 'website/.npmrc'
  pull_request:
    branches:
      - main
    # PR CI also runs when tests or this workflow itself change.
    paths:
      - 'website/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Enable pnpm via corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: website

      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('website/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: website


      - name: Build
        run: npm run build
        working-directory: website

      - name: Verify hreflang base dedupe (§2.7)
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const BASE = 'GDKVM';
          function walk(dir) {
            const out = [];
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) out.push(...walk(p));
              else if (e.isFile() && e.name.endsWith('.html')) out.push(p);
            }
            return out;
          }
          const files = walk('website/dist');
          const broken = [];
          files.forEach(f => {
            const c = fs.readFileSync(f, 'utf-8');
            const re = /<link rel=\"alternate\" hreflang=\"[^\"]*\" href=\"([^\"]+)\"/g;
            let m;
            while ((m = re.exec(c)) !== null) {
              const url = m[1];
              const hits = (url.match(new RegExp(BASE, 'g')) || []).length;
              if (hits > 1) broken.push(\`\${f}: \${url} has \${BASE} \${hits} times\`);
            }
          });
          if (broken.length) { console.log(broken.join('\n')); process.exit(1); }
          console.log('OK: no hreflang base duplication');
          "

      - name: Run E2E tests
        run: npx playwright test
        working-directory: website

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: website/playwright-report/
          retention-days: 7

      - name: Upload tested Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist/

  build-deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    # Serialize only actual Pages publication; PR/test jobs may run while a provider deploy is still in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy tested artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
